<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<section>
    <div class="container-fluid mt-5 p-1">
        <div class="row">
            <p class="text-center fs-3 mt-5">Tất Cả Đơn Hàng</p>
            <hr>
            <a href="/admin/" class="back-icon">Quay lại</a>
            <th:block th:if="${session.succMsg}">
                <p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
                <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
            </th:block>

            <th:block th:if="${session.errorMsg}">
                <p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
                <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
            </th:block>
            <div class="col-md-4 p-4">

                <form action="/admin/search-order" method="get">
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control " name="orderId"
                                   placeholder="Nhập mã đơn hàng">
                        </div>
                        <div class="col">
                            <button class="btn btn-primary col">Tìm Kiếm</button>
                        </div>
                    </div>
                </form>

            </div>
            <div class="col-md-12 ps-4 pe-4">

                <table class="table table-bordered card-sh">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Mã Đơn Hàng</th>
                        <th scope="col">Chi Tiết Giao Hàng</th>
                        <th scope="col">Ngày</th>
                        <th scope="col">Tên Sản Phẩm</th>
                        <th scope="col">Giá Tiền</th>
                        <th scope="col">Trạng Thái</th>
                        <th scope="col">Hoạt Động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Kiểm tra danh sách orders -->
                    <th:block th:if="${orders != null and !orders.empty}">
                        <tr th:each="o : ${orders}">
                            <!-- Sử dụng th:text thay vì [[...]] -->
                            <th scope="row" th:text="${o != null ? o.orderId : ''}"></th>
                            <td>
                                <!-- Sử dụng th:with để kiểm tra null -->
                                <th:block th:with="addr=${o != null ? o.ordersAddressEntity : null}">
                                    Name : <span th:text="${addr != null ? addr.name : ''}"></span><br>
                                    Email : <span th:text="${addr != null ? addr.email : ''}"></span><br>
                                    Phone: <span th:text="${addr != null ? addr.phone : ''}"></span><br>
                                    Address : <span th:text="${addr != null ? addr.address : ''}"></span><br>
                                    City : <span th:text="${addr != null ? addr.city : ''}"></span><br>
                                    Province : <span th:text="${addr != null ? addr.province : ''}"></span>
                                </th:block>
                            </td>
                            <td th:text="${o != null ? o.orderDate : ''}"></td>
                            <td th:text="${o != null and o.productEntity != null ? o.productEntity.product_name : ''}"></td>
                            <td>
                                Quantity : <span th:text="${o != null ? o.quantity : ''}"></span><br>
                                Price : <span th:text="${o != null ? o.price : ''}"></span><br>
                                Total Price : <span th:text="${o != null ? (o.quantity * o.price) : ''}"></span>
                            </td>
                            <td th:text="${o != null ? o.getStatusText() : ''}"></td>
                            <td>
                                <form action="/admin/update-order-status" method="post" th:if="${o != null}">
                                    <div class="row">
                                        <div class="col">
                                            <select class="form-control" name="st">
                                                <option value="">--select--</option>
                                                <option value="1">Đang Tiến Hành</option>
                                                <option value="2">Đã Nhận Được Đơn Hàng</option>
                                                <option value="3">Sản Phẩm Được Đóng Gói</option>
                                                <option value="4">Ra Ngoài Để Giao Hàng</option>
                                                <option value="5">Đã Giao Hàng</option>
                                                <option value="6">Huỷ Đơn Hàng</option>
                                            </select>
                                        </div>
                                        <input type="hidden" name="id" th:value="${o.id}">
                                        <div class="col">
                                            <button th:if="${o.status == 'Cancelled' || o.status == 'Delivered'}"
                                                    class="btn btn-primary btn-sm col disabled">Cập nhật</button>
                                            <button th:unless="${o.status == 'Cancelled' || o.status == 'Delivered'}"
                                                    class="btn btn-sm btn-primary">Cập nhật</button>
                                        </div>
                                    </div>
                                </form>
                            </td>
                        </tr>
                    </th:block>
                    <tr th:if="${orders == null || orders.empty}">
                        <td colspan="7" class="text-center">Không có đơn hàng nào</td>
                    </tr>
                    </tbody>
                </table>
                <div class="row">
                    <div class="col-md-4">
                        Tổng số đơn hàng: <span th:text="${orders != null ? #lists.size(orders) : 0}"></span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
</body>
</html>
